# Lint: runs PSScriptAnalyzer on every pull request and every push to main.
#
# Uses the same rules as a local run:
#   Invoke-ScriptAnalyzer -Path . -Recurse -Settings .\PSScriptAnalyzerSettings.psd1
# Any Error or Warning finding fails the check.

name: Lint

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: this workflow only needs to read the code.
permissions:
  contents: read

jobs:
  psscriptanalyzer:
    name: PSScriptAnalyzer
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      # The scripts target Windows PowerShell 5.1, so check that it can parse
      # them, not only PowerShell 7.
      - name: Syntax check (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $failed = $false
          foreach ($file in Get-ChildItem -Path . -Recurse -Include *.ps1, *.psm1, *.psd1) {
              $errors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$null, [ref]$errors)
              foreach ($e in $errors) {
                  Write-Output "::error file=$($file.FullName),line=$($e.Extent.StartLineNumber)::$($e.Message)"
                  $failed = $true
              }
          }
          if ($failed) { exit 1 }
          Write-Output "All scripts parse."

      # Pin the analyzer version so a new release can't change results
      # without a commit here.
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Force

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = @(Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1)

          # Show each finding as an annotation on the pull request.
          foreach ($r in $results) {
              $level = if ($r.Severity -eq "Error") { "error" } else { "warning" }
              Write-Output "::$level file=$($r.ScriptPath),line=$($r.Line),title=$($r.RuleName)::$($r.Message)"
          }

          if ($results.Count -gt 0) {
              Write-Output "$($results.Count) finding(s). Fix them, or suppress with a justification."
              exit 1
          }

          Write-Output "No findings."
